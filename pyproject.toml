[tool.poetry]
name = "ziplime"
version = "1.20.9"
description = ""
authors = ["Ziplime"]
readme = "README.md"
packages = [{include = "ziplime"}]

[tool.poetry.dependencies]
python = "^3.12"
aiocache = "^0.12.3"
aiofiles = "^24.1.0"
aiosqlite = "^0.21.0"
alembic = "^1.15.2"
asyncclick = "^8.1.8"
empyrical-reloaded = "^0.5.11"
exchange-calendars = "^4.10"
greenlet = "^3.2.2"
h5py = "^3.13.0"
iso3166 = "^2.1.1"
iso4217 = "^1.12.20240625"
joblib = "^1.5.1"
lime-trader-sdk = "^0.4.1"
limexhub = "^1.16.28"
networkx = "^3.4.2"
numexpr = "^2.10.2"
orjson = "^3.10.15"
pandas = "^2.0.0"
polars = "^1.24.0"
pyarrow = "^19.0.1"
pydantic = "^2.11.2"
pygments = "^2.18.0"
scipy = "^1.15.3"
setuptools = "^79.0.1"
sqlalchemy = "^2.0.40"
structlog = "^25.4.0"
tabulate = "^0.9.0"
python-dateutil = "^2.9.0.post0"
yfinance = "^0.2.65"
pandas-stubs = "~=2.3.3"
deltalake = "^1.6.1"
httpx = {extras = ["http2"], version = "^0.28.1"}

[tool.poetry.group.huggingface]
# Reading point-in-time datasets from the Hugging Face Hub. Optional, so an install that never
# mounts one does not carry it -- see ziplime.data.data_sources.huggingface.
optional = true

[tool.poetry.group.huggingface.dependencies]
huggingface-hub = "^1.0"

[tool.poetry.group.vectorbt]
optional = true

[tool.poetry.group.vectorbt.dependencies]
vectorbt = "0.28.2"


[tool.poetry.group.docs.dependencies]
mkdocs = {extras = ["i18n"], version = "^1.6.1"}
mkdocs-material = "^9.6.22"
mkdocstrings = {extras = ["python"], version = "^0.30.1"}
mdx-include = "^1.4.2"
markdown-include-variants = "^0.0.5"


[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"

[tool.poetry.scripts]
ziplime = "ziplime.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
