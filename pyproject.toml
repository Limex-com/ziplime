[tool.poetry]
name = "ziplime"
version = "1.20.9"
description = ""
authors = ["Ziplime"]
readme = "README.md"
packages = [{include = "ziplime"}]

[tool.poetry.dependencies]
python = "^3.12"
aiocache = "^0.12.3"
aiofiles = "^24.1.0"
aiosqlite = "^0.21.0"
alembic = "^1.15.2"
asyncclick = "^8.1.8"
empyrical-reloaded = "^0.5.11"
exchange-calendars = "^4.10"
greenlet = "^3.2.2"
h5py = "^3.13.0"
iso3166 = "^2.1.1"
iso4217 = "^1.12.20240625"
joblib = "^1.5.1"
lime-trader-sdk = "^0.4.1"
limexhub = "^1.16.28"
networkx = "^3.4.2"
numexpr = "^2.10.2"
orjson = "^3.10.15"
pandas = "^2.0.0"
polars = "^1.24.0"
pyarrow = "^19.0.1"
pydantic = "^2.11.2"
pygments = "^2.18.0"
scipy = "^1.15.3"
sqlalchemy = "^2.0.40"
structlog = "^25.4.0"
tabulate = "^0.9.0"
python-dateutil = "^2.9.0.post0"
yfinance = "^0.2.65"
deltalake = "^1.6.1"
httpx = {extras = ["http2"], version = "^0.28.1"}

# Optional features, published as pip extras: `pip install "ziplime[mcp]"`. Poetry groups are not
# published, which is why these are optional dependencies and not groups. Nothing in the core
# imports any of them at module level, so an install without one only loses that feature.
#
# mcp: the local MCP server -- see ziplime.mcp. The official `mcp` SDK, and not `fastmcp`, is not
# a preference: `lime-trader-sdk` pins attrs<23.0.0; `fastmcp` pulls `cyclopts`, which needs
# attrs>=23.1.0, and pip refuses the pair outright. `mcp` does not depend on attrs at all.
mcp = {version = "^2.2.0", optional = true}
# huggingface: reading point-in-time datasets from the Hugging Face Hub (`hf://` mounts) -- see
# ziplime.data.data_sources.huggingface. PyYAML reads the dataset card.
huggingface-hub = {version = "^1.0", optional = true}
pyyaml = {version = "^6.0", optional = true}
# options: Black-Scholes prices, implied volatility and Greeks for ziplime.finance.options.
# `vollib` is the maintained package; `py_vollib` is its deprecated alias and installing that
# instead emits a deprecation warning on every import.
vollib = {version = "^1.0.11", optional = true}
# numba: compiles the vector kernel's inner loop -- see ziplime.vectorized.kernel._core. Without it
# the same loop runs interpreted and produces identical numbers, just slower. Measured on 500
# instruments over five years: 0.055s compiled against 0.312s interpreted.
numba = {version = "^0.67", optional = true}

[tool.poetry.extras]
mcp = ["mcp"]
huggingface = ["huggingface-hub", "pyyaml"]
options = ["vollib"]
numba = ["numba"]
all = ["mcp", "huggingface-hub", "pyyaml", "vollib", "numba"]

[tool.poetry.group.docs.dependencies]
mkdocs = {extras = ["i18n"], version = "^1.6.1"}
mkdocs-material = "^9.6.22"
mkdocstrings = {extras = ["python"], version = "^0.30.1"}
mdx-include = "^1.4.2"
markdown-include-variants = "^0.0.5"


[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-cov = "^7.1.0"
coverage = "^7.16.1"
flake8 = "^7.3.0"
pandas-stubs = "~=2.3.3"
# A reference engine for tests, and nothing else: nothing under ziplime/ imports it, and
# `tests/reference/vectorbt/` holds the two side by side on the same signals. plotly is pinned
# below 6, and not by preference: vectorbt 0.28 registers a plotly theme referencing
# `scattermapbox`, which plotly 6 removed, so `import vectorbt` raises on plotly 6+.
vectorbt = "0.28.2"
plotly = "<6"

[tool.poetry.scripts]
ziplime = "ziplime.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
